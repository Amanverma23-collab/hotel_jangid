<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C388"/>
      <stop offset="50%" stop-color="#C99F5B"/>
      <stop offset="100%" stop-color="#9E7835"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1B16"/>
      <stop offset="100%" stop-color="#12100E"/>
    </linearGradient>
  </defs>
  <!-- Background with subtle luxury gradient -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Border -->
  <rect x="24" y="24" width="464" height="464" rx="84" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.85"/>
  <rect x="36" y="36" width="440" height="440" rx="72" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.45"/>

  <!-- Top Crown / Temple Kalash Crest -->
  <path d="M 256 95 L 275 140 L 320 145 L 285 175 L 295 215 L 256 190 L 217 215 L 227 175 L 192 145 L 237 140 Z" fill="url(#goldGrad)" opacity="0.95"/>

  <!-- Monogram: HJ (Hotel Jangid) in Luxury Editorial Serif -->
  <text x="256" y="340" font-family="'Playfair Display', Georgia, serif" font-size="160" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">HJ</text>

  <!-- Subtitle: GOGAMEDI -->
  <text x="256" y="405" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="600" fill="#EAE5DE" text-anchor="middle" letter-spacing="8" opacity="0.9">GOGAMEDI</text>
</svg>
