<!doctype html>
<html lang="en" class="scroll-smooth bg-[#FAF8F5]" style="background-color: #FAF8F5 !important;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF8F5" />
    <meta name="color-scheme" content="light" />
    <title>Hotel Jangid | Where Elegance Meets Tranquility</title>
    <meta name="description" content="Experience unparalleled luxury, breathtaking views, and world-class hospitality at Hotel Jangid." />

    <!-- 1 & 2. Inline critical CSS in <head>: site background & prevent FOUC / black bar -->
    <style>
      /* Ensure zero white or dark flash before CSS loads */
      html, body {
        background-color: #FAF8F5 !important;
        background: #FAF8F5 !important;
        margin: 0 !important;
        padding: 0 !important;
        color: #111111;
        color-scheme: light;
      }
      #root {
        background-color: #FAF8F5 !important;
        min-height: 100vh;
      }
      /* Hide floating navbar completely by default so it never flashes on load */
      #floating-navbar {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        transform: translateY(-100%) !important;
      }
      /* 4. Elements animated on load have hidden initial state (opacity: 0) in CSS */
      .left-hero-card,
      .hero-headline-text,
      .right-card-stagger-1,
      .right-card-stagger-2,
      .right-card-stagger-3 {
        opacity: 0;
      }
    </style>

    <!-- 3. All CSS loaded in <head> directly (not injected late via JS) -->
    <link rel="stylesheet" href="/src/index.css" />

    <!-- 5. Preload hero images with fetchpriority="high" for instant render -->
    <link rel="preload" as="image" href="/images/hotel-building-hero.jpg" media="(min-width: 768px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/hotel-building-hero-mobile.jpg" media="(max-width: 767px)" fetchpriority="high" />

    <!-- Google Fonts: Luxury Editorial Serif & Clean Geometric Sans with font-display: swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FAF8F5] text-[#111111] selection:bg-[#c99f5b]/30 selection:text-[#111111] antialiased" style="background-color: #FAF8F5 !important; margin: 0 !important;">
    <div id="root" style="background-color: #FAF8F5;"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
